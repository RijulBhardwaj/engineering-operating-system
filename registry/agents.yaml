# Agent persona registry. Full definitions live in .claude/agents/*.md -- this file is the index + metadata.
agents:
  - {id: engineering-lead, file: .claude/agents/engineering-lead.md, model_tier: high, invoke_when: "multi-specialist task, ambiguous scope decomposition", primary_domain: ARCH, secondary_domains: [CORE, SPEC]}
  - {id: software-architect, file: .claude/agents/software-architect.md, model_tier: high, invoke_when: "new project, new service boundary, technology swap, scaling problem", primary_domain: ARCH, secondary_domains: [ADR, DISTRIBUTED, CORE]}
  - {id: backend-engineer, file: .claude/agents/backend-engineer.md, model_tier: medium, invoke_when: "server-side feature against an approved spec/ADR", primary_domain: BE, secondary_domains: [API, DB, SEC, BFF]}
  - {id: frontend-engineer, file: .claude/agents/frontend-engineer.md, model_tier: medium, invoke_when: "client-side feature against an approved spec", primary_domain: FE, secondary_domains: [UI, UX, DESIGN, MOTION]}
  - {id: ai-ml-engineer, file: .claude/agents/ai-ml-engineer.md, model_tier: high, invoke_when: "model, embeddings, retrieval, or agent/tool pipeline work", primary_domain: AI, secondary_domains: [LLM, RAG, AGENT, MLOPS]}
  - {id: data-engineer, file: .claude/agents/data-engineer.md, model_tier: medium, invoke_when: "data pipeline at a scale/frequency that justifies one", primary_domain: DATA, secondary_domains: [DB, WAREHOUSE, DATAOPS]}
  - {id: devops-engineer, file: .claude/agents/devops-engineer.md, model_tier: medium, invoke_when: "CI/CD, containerization, environment config", primary_domain: DEVOPS, secondary_domains: [CONTAINER, IAC, RELEASE]}
  - {id: cloud-engineer, file: .claude/agents/cloud-engineer.md, model_tier: medium, invoke_when: "cloud resources, network topology, IAM policy", primary_domain: CLOUD, secondary_domains: [NETWORK, AUTH, SERVERLESS]}
  - {id: security-engineer, file: .claude/agents/security-engineer.md, model_tier: high, invoke_when: "auth, sensitive data, external input, pre-release trust-boundary review", primary_domain: SEC, secondary_domains: [AUTH, APPSEC, COMPLIANCE]}
  - {id: qa-engineer, file: .claude/agents/qa-engineer.md, model_tier: medium, invoke_when: "test plan beyond unit tests, regression characterization", primary_domain: QA, secondary_domains: [TEST, E2E, AUTOMATION]}
  - {id: code-reviewer, file: .claude/agents/code-reviewer.md, model_tier: high, invoke_when: "before merge, anything beyond a trivial change -- never the author", primary_domain: REFACTOR, secondary_domains: [CORE, SEC, ARCH]}
  - {id: technical-writer, file: .claude/agents/technical-writer.md, model_tier: low, invoke_when: "feature ships without docs, or docs drift from behavior", primary_domain: DOCS, secondary_domains: [TECHWRITE, SPEC]}

# Model tier policy (applies across all agents above):
#   low    -- file discovery, mechanical edits, formatting, routine docs
#   medium -- routine implementation, standard debugging, unit tests, small architecture changes
#   high   -- architecture design, security analysis, complex debugging, distributed systems, independent review
# "Critical complexity" (cross-system architecture, major security/infra decisions) uses the highest
# available reasoning effort PLUS independent verification by a second agent/session -- see
# .claude/rules/agent-coordination.md and workflows/autonomous-development/README.md.
#
# Multi-session orchestration: this harness does NOT implement a custom orchestration engine.
# It uses the platform's own Agent tool (single subagent) and Workflow tool (multi-agent pipeline,
# opt-in only) as the orchestration mechanism. Building a parallel custom system would duplicate
# infrastructure the platform already provides -- see harness/orchestration/README.md for the full
# rationale.
