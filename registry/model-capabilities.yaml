# Model/effort selection policy. This is policy for choosing a model+effort for a task.
# Implemented 2026-10-31: CLAUDE_CODE_SUBAGENT_MODEL=haiku set in ~/.claude/settings.json env --
# subagents default to the cheapest tier unless a specific agent's frontmatter overrides it.

model_tiers:
  haiku:
    model_id: claude-haiku-5-5
    use_for: [file search, log/output summaries, grep-equivalent scans, mechanical lookups, simple formatting]
    default_for: subagents (via CLAUDE_CODE_SUBAGENT_MODEL=haiku), unless overridden per-agent
  sonnet:
    model_id: claude-sonnet-5-5
    use_for: [daily coding, bug fixes, tests, single/few-file refactors, routine implementation]
    default_for: "main session (current settings.json model field is set to sonnet) and most .claude/agents/*.md entries at medium tier"
  opus:
    model_id: claude-opus-5-5
    use_for: [architecture design, security analysis, complex/multi-step debugging, independent review, root-cause analysis, ambiguous-scope decisions]
    default_for: .claude/agents/*.md entries tagged model_tier high in registry/agents.yaml

rules:
  - "Delegate bounded, low-judgment work to haiku subagents -- the CLAUDE_CODE_SUBAGENT_MODEL default handles this without per-task thought."
  - "Keep architectural decisions, ambiguous scope, and root-cause analysis in the main/opus-tier reasoning -- do not delegate these to a cheaper subagent just to parallelize."
  - "Hand well-defined, multi-file code changes to sonnet-tier subagents with full context: issue, acceptance criteria, relevant files, constraints, validation commands -- not a one-line prompt."
  - "Do NOT delegate when the change is small and already fully understood -- handoff overhead costs more than doing it inline. This is the same rule as agent-coordination.md's 'minimum sufficient agent set.'"

main_session_model:
  current: sonnet (set in ~/.claude/settings.json "model" field)
  opusplan_option: "/model opusplan runs the main session on Opus for planning/review and Sonnet for execution. Not set as the account default here -- it roughly doubles planning-phase cost and is a per-session interactive choice, not something to force silently. Switch to it yourself with /model opusplan when a task's planning complexity justifies it."

implemented:
  - "CLAUDE_CODE_SUBAGENT_MODEL=haiku in ~/.claude/settings.json env (2026-10-31)"
  - "registry/agents.yaml's model_tier field per persona already existed before this policy; this file is the decision table that field implements"

note: "No custom model-routing software was built -- this is a decision table plus one real settings change (the env var). Per-task routing is a judgment call made by whoever is driving (human or agent), using this table, not an automated classifier."
