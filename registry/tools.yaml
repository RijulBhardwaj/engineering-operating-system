    relevant_lifecycle_stages: [content, delivery]
    last_reviewed: "2026-11-25"
    security_status: "LGPL/GPL per-build (Gyan.FFmpeg's `full_build`, GPL). Installed via winget (Gyan.FFmpeg), installer hash verified by winget."
    decision: "Installed 2026-11-25 via winget (`winget install --id Gyan.FFmpeg`) -- a package manager was available on this machine (winget; choco/scoop were not), so the documented-static-binary-download fallback in the task brief was not needed. Winget extracted it under the current user's WinGet packages cache and added `ffmpeg`/`ffplay`/`ffprobe` command-line aliases + updated the current user's PATH (not system-wide) automatically -- verified by running `ffmpeg -version` in a shell that re-read the persisted PATH. **Fontconfig gap RESOLVED 2026-11-25, not via real fontconfig.** This build has no fontconfig default config, so `drawtext` with a bare `fontfile=<name>` (no fontconfig lookup needed in principle) still fell through to a fontconfig lookup whenever FreeType's direct load of the bare/relative filename failed (Windows CWD-relative lookup never finds it) -- `Fontconfig error: Cannot load default config file`. Tried the 'install real fontconfig' path first: no winget/choco package exists for fontconfig on Windows, and a hand-built minimal `fonts.conf` + `FONTCONFIG_FILE` env var made this FFmpeg build **segfault** (exit 139) instead of erroring -- worse than the original failure, reverted immediately (file + env var removed, nothing pre-existing was touched). The actual fix: OpenMontage's `ShowcaseCard` tool already used `fontfile=` (never `font=`), but with a bare filename (`segoeuib.ttf`/`segoeui.ttf`) that FreeType couldn't resolve directly -- patched `_eval/openmontage/tools/video/showcase_card.py` to resolve the validated bare filename to an absolute path under `C:/Windows/Fonts/` (or other OS font dirs) before building the filter string, so FreeType loads it directly and never reaches the fontconfig fallback. The font-name validation regex (security boundary against path injection, covered by `test_showcase_card_security.py`) was left untouched -- resolution happens internally, after validation. Fixed 2 of OpenMontage's `ShowcaseCard`-execute()-path test failures this way (`test_legitimate_render_with_tricky_punctuation_succeeds`, `test_showcase_render_in_quoted_temp_directory_and_cleanup`). **Residual gap, by design not patched**: 3 of the original 7 failures (`test_textfile_path_punctuation_preserves_rendered_frame[*]`) call FFmpeg `drawtext` directly from the test file with no `fontfile=` at all (testing path-escaping, not font resolution) -- those still need a real system fontconfig default font lookup, which this FFmpeg build cannot do without crashing; not fixed, left as a genuine upstream-test-only gap, not hand-patched. 2 more of the original 7 (`test_trace_matches_the_actual_terminal_scene_cursor`, `test_checkpoint_only_resume_preserves_media_format[webp]`) turned out on closer inspection to be unrelated pre-existing bugs (a Windows stdout cp1252/UTF-8 decode mismatch reading Node's emoji output, and a WebP-vs-PNG MIME-sniffing mismatch in a data-URI helper) -- not fontconfig-related at all, not touched, flagged here since the original 2026-11-25 note incorrectly attributed all 7 failures to fontconfig."

