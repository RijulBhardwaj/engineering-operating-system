  - id: manim-skill
    name: Manim skill (adithya-s-k/manim_skill)
    description: AI-agent skill bundle of best practices and code patterns for Manim Community Edition and ManimGL (3Blue1Brown-style math/diagram animations) -- manimce-best-practices, manimgl-best-practices, manim-composer (scene planning).
    category: Claude Code Skill
    primary_domain: VIDEO
    secondary_domains: [AI-ML, CONTENT]
    source: https://github.com/adithya-s-k/manim_skill
    installation_status: installed
    compatible: true
    relevant_lifecycle_stages: [content, delivery]
    last_reviewed: "2026-11-24"
    security_status: "MIT. Installed via `npx skills add -g adithya-s-k/manim_skill`, landed in ~/.agents/skills/{manim-composer,manimce-best-practices,manimgl-best-practices} and symlinked into ~/.claude/skills/ -- verified by directory listing, not just the installer's own success message."
    decision: "Installed 2026-11-24 globally/account-wide (`-g` flag), same mechanism and location as the pre-existing GSAP/Motion skills. Render chain verified 2026-11-25: `pip install manim` (v0.22.1) via the Windows Store python, FFmpeg now on PATH (see `ffmpeg` entry), and a trivial scene (`Circle` + `Text`, no `MathTex`/`Tex`) actually rendered with the real `manim` CLI (`manim -ql`) to a real, non-empty MP4 -- not just an installer success message. Hit and fixed one real issue: a stale/binary-mismatched `scipy` under the Windows Store python's user site-packages broke `import manim` (`ImportError: cannot import name '_promote'`) until `pip install --force-reinstall --no-deps scipy` was run. **LaTeX gap RESOLVED 2026-11-25 via MiKTeX Basic, not Tectonic.** Tectonic was tried first per the lighter-weight preference: downloaded its official prebuilt Windows binary (GitHub release `tectonic-0.17.0-x86_64-pc-windows-msvc.zip`, ~50MB single self-contained exe, added to user PATH) and verified it runs (`tectonic --version`). But manim 0.22.1's `make_tex_compilation_command()` (`manim/utils/tex_file_writing.py`) hardcodes an allow-list of `{latex, pdflatex, luatex, lualatex, xelatex}` for `tex_compiler` and raises `ValueError` for anything else, and even bypassing that, the flags it passes (`-interaction=batchmode`, `-output-format=pdf`, `-halt-on-error`, `-output-directory=`) are pdflatex-specific and not accepted by Tectonic's actual clap-based CLI (`-o`/`--outdir`, `--outfmt`) -- verified directly by running Tectonic with manim's exact generated argv, which fails immediately (`error: unexpected argument '-i' found`). This is a genuine incompatibility in this manim version, not an assumption -- no clean, non-hack way to wire Tectonic in without either patching manim's source or shimming a fake `pdflatex` binary on PATH, both rejected as hackier than the brief wanted. Fell back to MiKTeX Basic per the task's own fallback: `winget install --id MiKTeX.MiKTeX` (confirms it installs `basic-miktex-25.12-x64.exe`, the lighter variant, not full/complete), `initexmf --set-config-value=[MPM]AutoInstall=1` so missing packages (`amsmath` etc.) install on-the-fly non-interactively, MiKTeX's `pdflatex` added to user PATH. **Verified end-to-end**: rendered a real `MathTex(r\"e^{i\\pi} + 1 = 0\")` scene with `manim -ql` to a real MP4 (2573 bytes, non-empty, playable) -- not a mock. Tectonic itself is left installed (small, harmless, may be useful standalone) but is NOT wired into manim; `tex_compiler` stays at manim's default (`pdflatex`, now resolved via MiKTeX)."

