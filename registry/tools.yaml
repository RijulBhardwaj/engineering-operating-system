    category: Claude Code plugin / CLI tool generator
    primary_domain: DX
    secondary_domains: [CORE]
    source: https://github.com/HKUDS/CLI-Anything
    installation_status: installed
    compatible: true
    last_reviewed: "2026-11-24"
    decision: "Installed 2026-11-24 per explicit user instruction (\"most important, implement this right now\"). User's framing (\"use it to access apps made for human clickable\") was corrected before install: this tool only wraps apps/services with a real headless backend or API -- it cannot click-automate an arbitrary GUI-only app. For that, this harness already has computer-use/Chrome MCP tools. Use CLI-Anything when a new tool's real backend is wrappable (headless CLI mode, or a documented API with credentials the user provides) and repeated structured calls beat one-off clicking. Harness generation needs a frontier model (Opus/Sonnet) per its own README. No built-in credential-scoping guidance for service-backed harnesses -- scope API keys/credentials manually per this harness's security.md before wrapping any SaaS API."

