  - id: volta
    name: Volta
    description: Per-project JavaScript tool manager (Node/npm/yarn/pnpm version pinning) -- pins a Node version in a project's own package.json "volta" field and auto-switches transparently per directory via shims on PATH.
    category: Software library / CLI tool
    primary_domain: DX
    secondary_domains: [VIDEO]
    source: https://volta.sh
    installation_status: installed
    compatible: true
    relevant_lifecycle_stages: [development, content]
    last_reviewed: "2026-11-25"
    security_status: "BSD-2-Clause-Views. Official signed MSI via winget (Volta.Volta), installer hash verified by winget. Installs per-user into %LOCALAPPDATA%\\Volta, no admin/system-wide changes."
    decision: "Installed 2026-11-25 to isolate OpenMontage's Node 22+ requirement from this machine's actual system Node (v26.13.0 on PATH -- note: the task background's claim of 'system Node v20.13.0' was checked against reality and found stale; the true system install is v26.13.0, verified via `node -v`/`where node`) without touching other projects. Verified Volta's own resolution rules before relying on them (docs.volta.sh/guide/understanding + getting-started, fetched 2026-11-25): a project's package.json `volta` field always wins; otherwise `node` resolves to whatever `volta install` last set as the **global default** -- there is no per-machine 'leave unpinned directories alone' mode once Volta's shims are on PATH. This means an unpinned project (e.g. CAT_Guide/video) is NOT naturally immune to a Volta default change -- it was made safe here only by deliberately setting the Volta default to `node@26.13.0`, exactly matching the pre-existing system version, so every unpinned directory resolves to the identical Node version it did before Volta existed. CAT_Guide/video itself is unaffected either way since its own `engines` field (`^20.19.0 || ^22.13.0 || >=24`) already accepts 26.13.0. OpenMontage's `remotion-composer/package.json` carries its own `volta.node: 22.23.4` pin (cached via `volta install node@22.23.4`), verified with `volta run node --version` inside that directory returning v22.23.4 while the global default stays v26.13.0. Caveat: `volta install node@X` always resets the *global default* to the just-installed version as a side effect -- after installing 22.23.4 for the pin, the default had to be explicitly re-set back to 26.13.0 with a second `volta install node@26.13.0` call. Anyone adding another pinned Node version later must redo this same re-pin-the-default step or risk silently changing what unpinned projects resolve to."

