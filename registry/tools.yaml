    compatible: true
    relevant_lifecycle_stages: [reporting, documents]
    last_reviewed: "2026-11-24"
    security_status: "LGPL-3.0, long-running py-pdf org project, mainstream PyFPDF successor."
    decision: "Installed 2026-11-24 per explicit user instruction, earmarked for fitness-intelligence-platform. Flag: that project is pure TypeScript/Cloudflare Workers (no Python anywhere in the repo), and per the fitness-ai session's last report, PDF export already works there (a working Download-PDF button was confirmed). fpdf2 can't plug into a Workers/TS stack directly -- it needs a Python runtime. Available globally for any project that does run Python; using it in fitness-intelligence-platform specifically needs either a Python worker/service added to that project (an architecture decision for that project's own session, not this harness) or dropping fpdf2 in favor of the TS-side library already generating PDFs there."

