    category: Claude Code plugin
    primary_domain: CORE
    secondary_domains: [DX]
    source: https://github.com/google/elephant-goldfish-model
    installation_status: installed
    compatible: true
    relevant_lifecycle_stages: [planning, architecture]
    last_reviewed: "2026-11-24"
    decision: "Enabled 2026-11-24 per explicit user instruction (\"especially the first plan stage (follow elephant goldfish model)\"). Was present but disabled in settings since an earlier audit; now wired as the mandatory Gate 0 in architecture.md -- no implementation starts on a plan a fresh goldfish subagent hasn't reviewed."

