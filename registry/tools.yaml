    last_reviewed: "2026-11-25"
    security_status: "No license file reviewed beyond the repo being public and documented as free; installed via its own documented method (git clone + venv + pip install -r requirements.txt, no admin rights needed). Cloned into harness/video-generation/_eval/wan2gp-test/Wan2GP/ which is gitignored in its entirety (the clone plus its .venv and ~12GB of auto-downloaded model weights are not committed, only the eval's own settings.json/README/output video are) -- reproduce via the clone command in that README, not by expecting the source in this repo."
    decision: "Installed and actually tested 2026-11-25 (not just researched) to determine whether this machine's RTX 3050 Laptop GPU (6GB VRAM, confirmed via nvidia-smi) is genuinely sufficient for local diffusion video generation, after three deterministic-rendering attempts at a 'moving painting' painterly look all confirmed the same structural limit (code-driven rendering cannot reproduce diffusion texture). Full evidence: harness/video-generation/_eval/wan2gp-test/README.md. Verdict: VRAM constraint genuinely solved for the smallest model in the family (Wan2.1 Text2Video 1.3B) -- a real headless generation (832x480, 33 frames, 20 steps) completed in 5m23s peaking at only ~680-850MB VRAM, confirmed live via nvidia-smi, nowhere near the 6GB ceiling. But the output is flat vector/cutout-illustration style, not painterly brushwork -- a real diffusion result (soft color blending, coherent motion), just not the specific look this genre needs. Larger Wan models that might render more paint-like need 12GB+, out of reach here. NOT adopted as a default or as a replacement for the deterministic Manim/Three.js/Remotion pipeline CAT-prep content still uses (diffusion can't guarantee accurate on-screen math/text) -- kept as a second, separate engine specifically for stylized/non-accuracy-critical video, pending further prompt/style iteration to actually close the painterly gap (not done in this pass, a style question now, not a hardware blocker). Install note: PyTorch 2.5.1+cu121 installs cleanly and loads the full model but fails at the first denoising step with a real torch._dynamo.disable() API mismatch (TypeError: unexpected keyword argument 'reason') against Wan2GP's startup shim -- use the exact PyTorch 2.10.0+cu130 combo this repo's own install docs specify for RTX 30XX-50XX, not an arbitrary older CUDA build. Also note requirements.txt pulls in a CPU-only torch as a transitive dependency on some package resolutions -- reinstall the CUDA build again after requirements.txt if torch.cuda.is_available() comes back False.

      FOLLOW-UP 2026-11-25 (same day, style-gap pass): the pending painterly-gap iteration above was actually run, not left open. (1) LoRA: Wan2GP's wgp.py confirms real LoRA support (activated_loras/loras_multipliers plumbing, per-model lora dir under loras/<model_type>/) and the loras/wan_1.3B/ dir already exists but is empty. Real web search (CivitAI + HuggingFace) for a free painterly/oil/watercolor LoRA found several -- 'Flow Oil' (latentcat/flow-oil-WAN14BT2V, Van-Gogh-influenced oil-paint LoRA), '[WAN2.1] Realistic Oil Paintings [STYLE]' on Civitai, Remade-AI historic-painting LoRA -- but every one is trained for the Wan 14B model (12GB+ VRAM), not the 1.3B this 6GB card runs; none found for Wan2.1 T2V 1.3B. No LoRA installed or tested -- forcing a 14B-trained LoRA onto the 1.3B model would produce meaningless/broken output, not a real test, so this was correctly out of reach rather than skipped lazily. (2) Prompt-only iteration, same cheap settings (832x480/33 frames) for apples-to-apples: v2 added strong painterly-technique language ('thick impasto brushstrokes, visible canvas texture, loose painterly edges, Van Gogh style swirling motion, oil paint texture') plus a negative prompt ('flat vector, clean lines, cel-shaded, flat color planes, cutout illustration, cartoon'), same 20 steps/guidance 6 -- result (`_eval/wan2gp-test/wan2gp-painterly-v2-negprompt.mp4`, frame in `frames_v2/frame_2.png`) swung hard the OTHER direction: photorealistic macro photography of soil/seed/worms with real depth-of-field and lighting, zero flat-vector cutout look left, but also zero painterly brushwork -- no stroke texture, no impasto, no paint-like blending; same negative result, different failure mode. v3 raised guidance 6->9, steps 20->30, lowered flow_shift 5->3 with the same prompt text -- result (`wan2gp-painterly-v3-highguidance.mp4`, `frames_v3/frame_mid.png`) produced swirling molten-gold/liquid patterns with real curved stroke-like structure and texture variance (the closest of all three attempts to 'brushwork'), but abandoned the seed/soil subject entirely (prompt coherence collapsed into abstraction) -- not a usable recipe. HONEST VERDICT: at the 1.3B scale this card can run, the model has essentially two attractors (flat/vector illustration, or photoreal/liquid abstraction) and prompt-only steering swings between them rather than landing on painterly brushwork in the middle; the gap is NOT closed by prompt engineering or by any freely available Wan2.1-compatible LoRA found in this pass. Full evidence and frame comparisons: `harness/video-generation/_eval/wan2gp-test/README.md`."

