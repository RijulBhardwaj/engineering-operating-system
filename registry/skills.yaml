  - id: ponytail
    name: Ponytail 5
    description: "YAGNI-ladder coding discipline skill: stop at the first rung that solves the problem (reuse -> stdlib -> native -> dependency -> one line -> minimum code), lazy about the solution, never about reading the problem first. Leaves a test for risky logic; never skips validation/security/accessibility. Overlaps chisle's code ladder -- see decision."
    category: Claude Plugin
    source: https://github.com/DietrichGebert/ponytail
    installation_status: installed
    installation_location: Claude plugin marketplace (ponytail@ponytail), user scope
    compatible: true
    lifecycle_stages: [coding, testing]
    relevant_agents: [all]
    last_reviewed: "2026-11-02"
    security_status: "Installed via `claude plugin marketplace add` / `claude plugin install` from the official DietrichGebert/ponytail repo. MIT license. No .exe/.dll shipped per upstream README warning -- only install from that repo or @dietrichgebert/ponytail on npm."
    decision: "Installed 2026-11-02, user's explicit request. Active globally next session restart (per-prompt skill, not a hook). Both ponytail and chisle encode a YAGNI/lazy-coding ladder -- if both are active and conflict in practice, that's a user call, not an auto-resolution; flag it if noticed, don't silently prefer one."

