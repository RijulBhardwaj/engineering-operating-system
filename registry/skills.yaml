    last_reviewed: "2026-10-31"
    security_status: "Dry-run previewed before install: only adds the marketplace + installs the plugin, same pattern as agent-skills/floorplan. MIT licensed, zero dependencies per docs. 729 stars, pushed 2026-10-24 -- plausible, actively maintained."
    decision: "Installed 2026-10-31 at user's explicit instruction, REPLACING ponytail and caveman (both set to false in ~/.claude/settings.json's enabledPlugins -- not uninstalled, just disabled, in case of rollback)."

