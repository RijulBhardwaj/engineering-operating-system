    category: Documentation Resource
    source: https://github.com/multica-ai/andrej-karpathy-skills
    installation_status: installed
    installation_location: Folded directly into .claude/rules/coding-standards.md (not a separate plugin -- it's a single markdown file, so adoption means merging its content into the rule file every session already reads)
    compatible: true
    lifecycle_stages: [coding]
    last_reviewed: "2026-10-31"
    security_status: "Low risk (plain markdown, no executable code). Star count reported (227149) is implausible for a single-file repo -- unverified."
    decision: "Adopted 2026-10-31 at user's explicit mandatory instruction. Merged (not duplicated) into coding-standards.md -- overlapping points with existing rules are cross-referenced rather than repeated twice."

